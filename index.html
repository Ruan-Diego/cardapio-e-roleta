<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3B2466">
<title>Roleta · Janine 1/4 de vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #3B2466;
    --ground-deep: #2A1849;
    --ground-soft: #5A3C91;
    --accent: #C9A7F5;
    --accent-deep: #A57BE6;
    --ivory: #F4EFE6;
    --muted: #D9D2C3;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Karla', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--ground);
    color: var(--ivory);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: relative; }
  .frame {
    position: absolute;
    inset: 12px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    pointer-events: none;
    z-index: 0;
  }
  main {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 44px 32px 48px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
  }
  .kicker {
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 600;
    font-style: italic;
    font-size: clamp(52px, 15vw, 72px);
    line-height: 1;
  }
  .tagline {
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    color: var(--muted);
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--ivory);
    opacity: 0.35;
  }
  .divider h2 {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }

  /* ---------- views ---------- */
  .view { display: none; flex-direction: column; gap: 28px; }
  .view.active { display: flex; }

  /* ---------- home ---------- */
  .choices { display: flex; flex-direction: column; gap: 16px; }
  .choice {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px 22px;
    border-radius: 6px;
    text-decoration: none;
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .choice:active { transform: scale(0.98); }
  .choice small {
    display: block;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    margin-top: 2px;
  }
  .choice svg { flex: none; }
  .choice.primary { background: var(--accent); color: var(--ground-deep); }
  .choice.primary small { color: #3B2466; }
  .choice.primary:hover { background: #D8C0FA; }
  .choice.secondary { border: 1.5px solid var(--accent); color: var(--ivory); }
  .choice.secondary small { color: var(--muted); }
  .choice.secondary:hover { background: rgba(201,167,245,0.08); }
  .rules {
    margin: 0;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
  }

  .back {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 4px;
    color: var(--accent);
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .back:hover { color: #E2D0FC; }

  /* ---------- cardápio ---------- */
  .menu { display: flex; flex-direction: column; gap: 36px; }
  .shot { display: flex; flex-direction: column; gap: 4px; }
  .shot-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .shot h3 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 26px; }
  .shot p { margin: 0; font-size: 16px; line-height: 1.4; color: var(--muted); }
  .level {
    flex: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .heat { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
  .heat i { width: 7px; height: 7px; border-radius: 50%; border: 1.2px solid var(--accent); }
  .heat i.on { background: var(--accent); }

  .level-group { display: flex; flex-direction: column; gap: 18px; }
  .level-head { display: flex; align-items: center; gap: 10px; }
  .level-title {
    margin: 0;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .menu-link {
    align-self: center;
    margin-top: 8px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    padding: 0 22px;
    border-radius: 999px;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
  }
  .menu-link:hover { background: rgba(201,167,245,0.1); }

  /* ---------- roleta ---------- */
  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 380px;
    margin: 8px auto 0;
    aspect-ratio: 1;
  }
  .wheel-btn {
    position: absolute;
    inset: 0;
    padding: 0;
    border: 0;
    background: none;
    border-radius: 50%;
    cursor: pointer;
  }
  .wheel-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; }
  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    transform: rotate(0deg);
    will-change: transform;
  }
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 48px;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
  }
  .spin {
    align-self: center;
    min-height: 56px;
    padding: 0 40px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: var(--ground-deep);
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.2s ease;
  }
  .spin:hover { background: #D8C0FA; }
  .spin:active { transform: scale(0.97); }
  .spin:disabled { opacity: 0.5; cursor: default; }
  .spin:focus-visible { outline: 3px solid var(--ivory); outline-offset: 4px; }

  .result {
    min-height: 132px;
    padding: 22px 20px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
  }
  .result .label {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--accent);
  }
  .result .title {
    font-family: var(--serif);
    font-weight: 600;
    font-style: italic;
    font-size: 34px;
    line-height: 1.1;
  }
  .result .desc { font-size: 16px; color: var(--muted); line-height: 1.4; }
  .result.idle .title { font-size: 22px; font-style: italic; font-weight: 400; color: var(--muted); }
  .result.pop { animation: pop 0.45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop {
    0% { transform: scale(0.9); opacity: 0.4; }
    100% { transform: scale(1); opacity: 1; }
  }

  footer {
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 17px;
    color: var(--accent);
  }

  @media (max-width: 380px) {
    main { padding: 36px 24px 40px; }
    .choice { font-size: 23px; padding: 18px; }
  }
</style>
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<main>
  <header>
    <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C9A7F5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v9h9"></path></svg>
    <div class="kicker">Janine · 1/4 de vida</div>
    <h1>Roleta</h1>
    <div class="tagline">errou? a roleta decide</div>
  </header>

  <section class="view active" id="view-roleta" aria-label="Roleta">
    <div class="wheel-wrap">
      <svg class="pointer" viewBox="0 0 40 48" aria-hidden="true">
        <path d="M20 46 L4 10 A16 16 0 0 1 36 10 Z" fill="#F4EFE6" stroke="#2A1849" stroke-width="2"></path>
        <circle cx="20" cy="14" r="5" fill="#A57BE6"></circle>
      </svg>
      <button class="wheel-btn" id="wheelBtn" type="button" aria-label="Girar a roleta">
        <svg id="wheel" viewBox="0 0 340 340" role="img" aria-label="Roleta com 4 fatias"></svg>
      </button>
    </div>

    <button class="spin" id="spinBtn" type="button">Girar</button>

    <div class="result idle" id="result" aria-live="polite">
      <div class="label">Resultado</div>
      <div class="title">Gire para descobrir seu destino</div>
    </div>
  </section>

  <footer>Saúde, Janine!</footer>
</main>

<script>
  // Fatias. As marcadas com fake: true aparecem na roleta, mas a roleta nunca para nelas:
  // quando cai numa delas, para por um instante e depois anda até a fatia seguinte.
  const SLICES = [
    { short: '1/4 de xote',   title: '1/4 de xote',     desc: 'Janine bebe 1/4 de shot. Saúde!',     fill: '#C9A7F5', text: '#2A1849' },
    { short: 'Livre!',        title: 'Livre!',          desc: '',                                     fill: '#F4EFE6', text: '#2A1849', fake: true },
    { short: '1/4 de xote',   title: '1/4 de xote',     desc: 'Janine bebe 1/4 de shot. Saúde!',     fill: '#C9A7F5', text: '#2A1849' },
    { short: 'Receba R$ 200', title: 'Receba R$ 200!',  desc: '',                                     fill: '#5A3C91', text: '#F4EFE6', fake: true }
  ];

  const N = SLICES.length;
  const SEG = 360 / N;
  const C = 170;
  const R = 156;
  const NS = 'http://www.w3.org/2000/svg';

  function pt(angleFromTop, r) {
    const a = angleFromTop * Math.PI / 180;
    return [C + r * Math.sin(a), C - r * Math.cos(a)];
  }
  function el(name, attrs, parent) {
    const node = document.createElementNS(NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  function buildWheel() {
    const svg = document.getElementById('wheel');
    el('circle', { cx: C, cy: C, r: 168, fill: '#2A1849' }, svg);
    el('circle', { cx: C, cy: C, r: 163, fill: 'none', stroke: '#C9A7F5', 'stroke-width': 2 }, svg);

    SLICES.forEach((s, i) => {
      const a0 = i * SEG, a1 = (i + 1) * SEG;
      const [x0, y0] = pt(a0, R);
      const [x1, y1] = pt(a1, R);
      el('path', {
        d: `M${C},${C} L${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} Z`,
        fill: s.fill, stroke: '#2A1849', 'stroke-width': 1.5
      }, svg);
      const mid = a0 + SEG / 2;
      const g = el('g', { transform: `rotate(${mid - 90} ${C} ${C})` }, svg);
      const t = el('text', {
        x: C + R - 14, y: C,
        'text-anchor': 'end', 'dominant-baseline': 'central',
        fill: s.text,
        'font-family': 'Karla, system-ui, sans-serif',
        'font-weight': 700, 'font-size': s.short.length >= 12 ? 15 : 18
      }, g);
      t.textContent = s.short;
    });

    for (let i = 0; i < 24; i++) {
      const [bx, by] = pt(i * 15, 163);
      el('circle', { cx: bx, cy: by, r: 3.6, fill: i % 2 === 0 ? '#F4EFE6' : '#C9A7F5' }, svg);
    }

    el('circle', { cx: C, cy: C, r: 28, fill: '#2A1849', stroke: '#C9A7F5', 'stroke-width': 2 }, svg);
    el('circle', { cx: C, cy: C, r: 20, fill: 'none', stroke: '#F4EFE6', 'stroke-width': 1, opacity: 0.4 }, svg);
    const j = el('text', {
      x: C, y: C + 1, 'text-anchor': 'middle', 'dominant-baseline': 'central',
      fill: '#C9A7F5', 'font-family': 'Fraunces, Georgia, serif',
      'font-style': 'italic', 'font-weight': 600, 'font-size': 19
    }, svg);
    j.textContent = 'J';
  }

  const wheel = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const wheelBtn = document.getElementById('wheelBtn');
  const result = document.getElementById('result');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rotation = 0;
  let spinning = false;

  function rand() {
    if (window.crypto && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] / 4294967296;
    }
    return Math.random();
  }

  // Ângulo da roleta que está sob o ponteiro (0 = topo, sentido horário).
  function pointerAngle() { return ((360 - (rotation % 360)) % 360 + 360) % 360; }

  // Gira até o ponteiro ficar no ângulo p da roleta.
  function rotateTo(p, turns, duration, easing) {
    const target = ((360 - p) % 360 + 360) % 360;
    const current = ((rotation % 360) + 360) % 360;
    let delta = target - current;
    if (delta < 0) delta += 360;
    rotation += turns * 360 + delta;
    wheel.style.transition = `transform ${duration}ms ${easing}`;
    wheel.style.transform = `rotate(${rotation}deg)`;
    return new Promise(r => setTimeout(r, duration + 80));
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function setResult(label, title, desc, pop) {
    result.className = 'result' + (pop ? '' : ' idle');
    if (pop) { void result.offsetWidth; result.className = 'result pop'; }
    result.innerHTML = '<div class="label"></div><div class="title"></div>' + (desc ? '<div class="desc"></div>' : '');
    result.querySelector('.label').textContent = label;
    result.querySelector('.title').textContent = title;
    if (desc) result.querySelector('.desc').textContent = desc;
  }

  async function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    setResult('Girando…', 'Que a sorte esteja com você', '', false);

    // Chances por trás dos panos: 80% de parar direto num 1/4 de xote (uma das duas fatias),
    // 20% de parar numa fatia fake (Livre! ou R$ 200), que depois anda até o xote seguinte.
    const real = [], fakes = [];
    SLICES.forEach((s, i) => (s.fake ? fakes : real).push(i));
    const pool = rand() < 0.8 ? real : fakes;
    let idx = pool[Math.floor(rand() * pool.length)];
    const offset = 0.2 + rand() * 0.6;            // onde, dentro da fatia, a roleta para
    await rotateTo(idx * SEG + offset * SEG, reduceMotion ? 1 : 6, reduceMotion ? 1200 : 5200, 'cubic-bezier(0.12, 0.8, 0.18, 1)');

    // Caiu numa fatia fake: para, finge que acabou e anda mais um pouco até a próxima.
    if (SLICES[idx].fake) {
      await wait(reduceMotion ? 300 : 1100);
      const next = (idx - 1 + N) % N;              // a fatia seguinte no sentido do giro
      const into = 0.25 + rand() * 0.3;
      await rotateTo(next * SEG + (1 - into) * SEG, 0, reduceMotion ? 600 : 1900, 'cubic-bezier(0.3, 0, 0.25, 1)');
      idx = next;
    }

    const s = SLICES[idx];
    setResult('Resultado', s.title, s.desc, true);
    if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
    spinning = false;
    spinBtn.disabled = false;
    spinBtn.textContent = 'Girar de novo';
  }

  spinBtn.addEventListener('click', spin);
  wheelBtn.addEventListener('click', spin);
  buildWheel();
</script>
</body>
</html>
